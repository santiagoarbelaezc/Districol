<section class="carrusel-category-section" *ngIf="productos.length > 0">
    <div class="carrusel-header">
        <div class="carrusel-titles">
            <h2 class="carrusel-titulo">{{ titulo }}</h2>
            <p class="carrusel-subtitulo" *ngIf="subtitulo">{{ subtitulo }}</p>
        </div>
    </div>

    <div class="carrusel-wrapper">
        <!-- Botón Anterior Circular -->
        <button class="control-btn control-prev" (click)="scrollCarousel('prev')" aria-label="Anterior">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
            </svg>
        </button>

        <div class="carrusel-track" [id]="'cat-carousel-' + categoriaId">
            <div class="carrusel-card" *ngFor="let producto of productos" (click)="verProducto(producto)" tabindex="0">
                
                <!-- Imagen con Gadgets / Badges -->
                <div class="card-image-wrapper">
                    <img [src]="producto.imagen" [alt]="producto.nombre" class="card-image" />
                    
                    <!-- Badge Superior Izquierda (Categoría / Tag en Fondo Negro) -->
                    <span class="badge-tag-top" *ngIf="producto.tag || producto.categoria">
                        {{ producto.tag || producto.categoria }}
                    </span>

                    <!-- Gadget Promocional Inferior (Promo del día / Descuento / Últimas unidades) -->
                    <span class="badge-promo-bottom" [ngClass]="'badge-' + (producto.badgeType || 'promo')" *ngIf="producto.badgePromo">
                        {{ producto.badgePromo }}
                    </span>
                </div>

                <!-- Contenido de la Tarjeta en Fondo Blanco -->
                <div class="card-info">
                    <h4 class="card-nombre">{{ producto.nombre }}</h4>
                    <p class="card-descripcion" *ngIf="producto.descripcion">{{ producto.descripcion }}</p>
                    
                    <!-- Precio / Unidad -->
                    <div class="card-precio-row" *ngIf="producto.precio">
                        <span class="precio-amount">{{ formatearPrecio(producto.precio) }}</span>
                        <span class="precio-unit">/ unidad</span>
                    </div>

                    <!-- Botón Ver Detalles visual -->
                    <button type="button" class="btn-ver-detalles">
                        <span>Ver Detalles</span>
                        <svg class="arrow-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                        </svg>
                    </button>
                </div>

            </div>
        </div>

        <!-- Botón Siguiente Circular -->
        <button class="control-btn control-next" (click)="scrollCarousel('next')" aria-label="Siguiente">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/>
            </svg>
        </button>
    </div>
</section>
